[package]
name = "cross-tetris-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen bridge exposing the Cross Tetris engine and AI to JS"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
ai = { path = "../ai" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
